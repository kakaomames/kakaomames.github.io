<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ロートテーブル JSON 作成ツール | Gemini programming隊</title>
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="robots" content="index, follow">
    <meta name="description" content="Gemini programming隊によるマイクラアドオンロートテーブルJSON作成サポートサイト">
    <meta name="author" content="Gemini programming隊">
    <link rel="icon" href="https://kakaomames.github.io/rei/logo.png">
    
    <style>
        body { font-family: sans-serif; padding: 0; background-color: #f4f4f4; margin: 0; }
        header { background-color: #2c3e50; color: white; padding: 10px 20px; text-align: right; }
        header a { color: #f1c40f; text-decoration: none; font-weight: bold; margin-left: 15px; }
        header a:hover { text-decoration: underline; }
        .container { max-width: 800px; margin: 20px auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); }
        h1 { color: #333; margin-top: 0; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input[type="text"], input[type="number"], select { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { margin-top: 20px; padding: 10px 15px; background-color: #2ecc71; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #27ae60; }
        .message { margin-top: 20px; padding: 15px; border-radius: 4px; background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        pre { background-color: #eee; padding: 10px; border-radius: 4px; overflow-x: auto; margin-top: 15px; }
        
        .pool-group {
            border: 3px solid #f1c40f; /* Poolは黄色で目立たせる */
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 10px;
            background-color: #fffaf5;
        }
        .entry-item {
            border: 1px solid #e67e22;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 6px;
            background-color: #fff8f0;
        }
        .entry-inputs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 10px;
        }
        .count-group { display: flex; gap: 5px; }
        .count-group input { width: 50%; }
        .remove-btn { background-color: #e74c3c; margin-left: 10px; padding: 5px 10px; }
        .add-btn { background-color: #9b59b6; margin-bottom: 0; margin-top: 10px; padding: 8px 12px; font-size: 14px;}
        .remove-pool-btn { background-color: #c0392b; float: right; margin-top: -5px; }
        
    </style>
</head>
<body>
    <header>
        <span>Gemini programming隊 アドオンサポート</span>
        <a href="index.html">ホームに戻る 🏠</a>
        <a href="ロート説明.html">ロートテーブルの説明</a>
    </header>
    
    <div class="container">
        <h1>📦 ロートテーブル JSON 作成ツール</h1>
        <p>ブロックやエンティティのドロップ、チェストの中身などを定義するロートテーブルを作成します。</p>
        
        <form id="lootTableForm">
            <h2>1. ロートテーブルの基本設定</h2>
            
            <label for="file_name">ファイル名 <span style="color: red;">*</span> (例: my_block_drops)</label>
            <input type="text" id="file_name" name="file_name" required placeholder="JSONファイル名 (my_block.json など)">

            <label for="loot_type">ロートテーブルのタイプ <span style="color: red;">*</span></label>
            <select id="loot_type" name="loot_type" required>
                <option value="blocks">ブロックのドロップ</option>
                <option value="entities">エンティティのドロップ</option>
                <option value="chests">チェストのルート</option>
            </select>

            <h2>2. ドロップ規則 (Pools) の定義</h2>
            <div id="poolsContainer">
                </div>
            
            <button type="button" id="addPoolButton" class="add-btn" style="background-color: #f1c40f; color: #333;">+ 新しいドロップ規則 (Pool) を追加</button>

            <button type="submit">JSONファイルをダウンロード 💾</button>
        </form>

        <div id="resultMessage" class="message" style="display: none;"></div>
        <div id="jsonOutput" style="display: none;">
            <h3>生成されたJSONプレビュー</h3>
            <pre id="jsonContent"></pre>
        </div>
    </div>

    <script src="loot_table_logic.js"></script> 
</body>
</html>
