<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Turbo Audio Analyzer">
    <link rel="icon" href="https://kakaomames.github.io/rei/logo.png">
    <title>ドレミ摘出　爆速版 - by Gemini</title>
    <style>
        body { font-family: 'Courier New', monospace; background: #001100; color: #00ff00; text-align: center; padding: 20px; }
        .panel { border: 2px solid #00ff00; background: #000; padding: 30px; border-radius: 15px; display: inline-block; }
        #progress { width: 100%; height: 20px; background: #333; margin-top: 10px; }
        #bar { width: 0%; height: 100%; background: #00ff00; }
        button { background: #00ff00; color: #000; border: none; padding: 15px 30px; font-weight: bold; cursor: pointer; font-size: 1.2rem; }
        #status { font-size: 1.5rem; margin: 20px 0; }
    </style>
</head>
<body>
    <img src="https://kakaomames.github.io/rei/logo.png" width="60">
    <h1>🚀 TURBO ANALYZER 🚀</h1>
    <div class="panel">
        <input type="file" id="audioFile" accept="audio/*">
        <div id="status">待機中...</div>
        <div id="progress"><div id="bar"></div></div>
        <br>
        <button id="dlBtn" style="display:none;" onclick="downloadJSON()">💾 JSONを保存</button>
    </div>

    <script>
        let musicScore = [];
        const noteStrings = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

        document.getElementById('audioFile').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            const arrayBuffer = await file.arrayBuffer();
            const tempCtx = new AudioContext();
            const audioBuffer = await tempCtx.decodeAudioData(arrayBuffer);
            
            document.getElementById('status').innerText = "爆速解析中...";
            
            // オフラインコンテキストで一気に処理
            const offCtx = new OfflineAudioContext(audioBuffer.numberOfChannels, audioBuffer.length, audioBuffer.sampleRate);
            
            // 解析ロジック（簡易高速版）
            const data = audioBuffer.getChannelData(0);
            const step = 2048; // 解析間隔
            let lastNote = "";

            for (let i = 0; i < data.length; i += step) {
                const segment = data.slice(i, i + step);
                const freq = autoCorrelate(segment, audioBuffer.sampleRate);
                if (freq > 0) {
                    const n = Math.round(12 * (Math.log(freq / 440) / Math.log(2))) + 69;
                    const note = noteStrings[n % 12] + (Math.floor(n / 12) - 1);
                    if (note !== lastNote) {
                        musicScore.push({ t: parseFloat((i / audioBuffer.sampleRate).toFixed(3)), n: note });
                        lastNote = note;
                    }
                }
                // 進捗表示
                if (i % (step * 50) === 0) document.getElementById('bar').style.width = (i / data.length * 100) + "%";
            }

            document.getElementById('status').innerText = "解析完了！🚀";
            document.getElementById('bar').style.width = "100%";
            document.getElementById('dlBtn').style.display = "inline-block";
        });

        function autoCorrelate(buffer, sampleRate) {
            let n = buffer.length; let rms = 0;
            for (let i = 0; i < n; i++) rms += buffer[i] * buffer[i];
            if (Math.sqrt(rms / n) < 0.02) return -1;
            let bestOffset = -1, bestCorrelation = 0;
            for (let offset = 20; offset < n; offset++) {
                let corr = 0; for (let i = 0; i < n - offset; i++) corr += buffer[i] * buffer[i + offset];
                if (corr > bestCorrelation) { bestCorrelation = corr; bestOffset = offset; }
            }
            return bestOffset > 0 ? sampleRate / bestOffset : -1;
        }

        function downloadJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(musicScore, null, 2));
            const link = document.createElement('a');
            link.href = dataStr; link.download = "turbo_score.json"; link.click();
        }
    </script>
</body>
</html>
