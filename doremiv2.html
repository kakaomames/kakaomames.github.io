<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="https://kakaomames.github.io/rei/logo.png">
    <title>kp3 Encoder - Gemini Programming</title>
    <style>
        body { font-family: 'Courier New', monospace; background: #000; color: #00ff00; text-align: center; padding: 20px; }
        .panel { border: 3px solid #00ff00; background: #0a0a0a; padding: 30px; border-radius: 20px; }
        textarea { width: 90%; height: 200px; background: #000; color: #00ff00; border: 1px solid #00ff00; margin-top: 20px; }
        #status { color: #00ffff; margin: 10px; }
        .logo { width: 60px; }
    </style>
</head>
<body>
    <img src="https://kakaomames.github.io/rei/logo.png" class="logo">
    <h1>🛰️ kp3 ENCODE UNIT 🛰️</h1>
    <div class="panel">
        <input type="file" id="audioFile" accept="audio/*">
        <div id="status">IDLE...</div>
        <button id="startBtn" disabled onclick="encodeKP3()">🚀 kp3を生成</button>
        <br>
        <textarea id="output" readonly placeholder="ここにkp3プロトコルが出力されます..."></textarea>
        <br>
        <button id="dlBtn" style="display:none;" onclick="downloadKP3()">💾 .kp3ファイルを保存</button>
    </div>

    <script>
        const noteStrings = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
        let kp3Result = "";

        document.getElementById('audioFile').addEventListener('change', e => {
            document.getElementById('startBtn').disabled = false;
            document.getElementById('status').innerText = "READY";
        });

        async function encodeKP3() {
            const file = document.getElementById('audioFile').files[0];
            const audioCtx = new AudioContext();
            const arrayBuffer = await file.arrayBuffer();
            const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
            const data = audioBuffer.getChannelData(0);
            const sampleRate = audioBuffer.sampleRate;
            
            document.getElementById('status').innerText = "ENCODING...";
            kp3Result = "";
            let lastNote = "";
            let waitTicks = 0;

            // 0.01秒ごとに解析
            const step = Math.floor(sampleRate * 0.01); 

            for (let i = 0; i < data.length; i += step) {
                const segment = data.slice(i, i + step);
                const freq = autoCorrelate(segment, sampleRate);
                let currentNote = "";

                if (freq > 0) {
                    const n = Math.round(12 * (Math.log(freq / 440) / Math.log(2))) + 69;
                    currentNote = noteStrings[n % 12] + (Math.floor(n / 12) - 1);
                }

                if (currentNote === lastNote) {
                    // 同じ音が続いているなら、待機時間を蓄積
                    waitTicks++;
                } else {
                    // 音が変わったら、蓄積した待機時間を記号化して書き出す
                    kp3Result += convertTicksToSymbols(waitTicks);
                    waitTicks = 0;
                    if (currentNote !== "") {
                        kp3Result += currentNote;
                    }
                    lastNote = currentNote;
                }

                if (i % (step * 100) === 0) {
                    document.getElementById('status').innerText = `PROGRESS: ${Math.round(i/data.length*100)}%`;
                    await new Promise(r => setTimeout(r, 0));
                }
            }
            
            kp3Result += convertTicksToSymbols(waitTicks) + ":"; // 最後に打ち切り記号
            document.getElementById('output').value = kp3Result;
            document.getElementById('status').innerText = "COMPLETE!";
            document.getElementById('dlBtn').style.display = "inline-block";
        }

        // 待機時間を K-SONIC ルールで記号化
        function convertTicksToSymbols(ticks) {
            let s = "";
            while (ticks >= 100) { s += " "; ticks -= 100; } // 1.0s
            while (ticks >= 10) { s += "\n"; ticks -= 10; } // 0.1s
            while (ticks >= 1) { s += "."; ticks -= 1; }    // 0.01s
            return s;
        }

        function autoCorrelate(buffer, sampleRate) {
            let n = buffer.length;
            let rms = 0;
            for (let i = 0; i < n; i++) rms += buffer[i] * buffer[i];
            if (Math.sqrt(rms / n) < 0.01) return -1;
            let bestOffset = -1;
            let bestCorrelation = 0;
            for (let offset = Math.floor(sampleRate/4000); offset < Math.floor(sampleRate/20); offset++) {
                let corr = 0;
                for (let i = 0; i < n - offset; i++) corr += buffer[i] * buffer[i + offset];
                if (corr > bestCorrelation) {
                    bestCorrelation = corr;
                    bestOffset = offset;
                }
            }
            return sampleRate / bestOffset;
        }

        function downloadKP3() {
            const blob = new Blob([kp3Result], {type: 'text/plain'});
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = "music.kp3";
            link.click();
        }
    </script>
</body>
</html>
