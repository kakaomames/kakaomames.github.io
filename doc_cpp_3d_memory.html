<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3Dモデルメモリ管理の研究報告</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; color: #333; max-width: 800px; margin: 20px auto; padding: 0 15px; }
        h1 { color: #C0392B; }
        .data-box { background: #fff5f5; padding: 15px; border-left: 5px solid #C0392B; font-family: monospace; }
    </style>
</head>
<body>
    <h1>C++による3Dモデルデータ処理のメモリ管理手法 💎</h1>
    <section>
        <h2>研究概要</h2>
        <p>obj形式およびBedrock Geometry（JSON）のパース時における、スマートポインタ(std::unique_ptr)を用いたメモリリーク防止戦略。</p>
    </section>
    <section>
        <h2>管理仕様</h2>
        <div class="data-box">
            - 巨大な頂点バッファはスタックではなくヒープ領域で管理<br>
            - 解放時: missionLog("MEMORY", "モデルのメモリを解放しました: " + modelID);
        </div>
    </section>
    <section>
        <h2>検証ロードマップ</h2>
        <ul>
            <li>スマートポインタによる所有権の明確化</li>
            <li>不要なポリゴンデータの自動パージ処理</li>
            <li>WEにおけるメモリ消費量のリアルタイム監視</li>
        </ul>
    </section>
</body>
</html>
