<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youtube - ホーム</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* 簡易的な動画グリッドのレイアウト (style.cssで定義することを推奨) */
        .video-grid-layout {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            padding: 24px;
        }
        .video-card {
            background-color: #0f0f0f;
            color: #f1f1f1;
            border-radius: 8px;
            overflow: hidden;
            text-decoration: none;
            display: block;
        }
        .thumbnail {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
        }
        .video-card-details {
            padding: 12px;
        }
        .video-card-title {
            font-size: 1.1rem;
            font-weight: 500;
            line-height: 1.4;
            margin: 0 0 4px 0;
            max-height: 3.2em; /* 2行表示の切り捨て */
            overflow: hidden;
        }
        .video-card-channel, .video-card-views {
            color: #aaa;
            font-size: 0.9rem;
            margin: 0;
        }
    </style>
</head>

            <a href="index.html" style="display: block; text-align: center; padding: 10px 0; color: white;">🏠<br>ホーム</a>
            <a href="#" style="display: block; text-align: center; padding: 10px 0; color: white;">🔥<br>急上昇</a>
        </aside>

        <main id="video-feed-container" style="margin-left: 72px; flex-grow: 1;">
            <div id="video-grid" class="video-grid-layout">

                </div>
        </main>

    <script src="auth_status.js"></script>
<script>
    // Vercel APIのベースURL
    const BASE_API_URL = "https://xeroxapp040.vercel.app/API/yt";
    
    /**
     * 動画カードのHTMLを生成するヘルパー関数
     */
    function createVideoCard(video) {
        // channel_url が /channel/index.html?c=CHANNEL_ID の形式を想定
        // videoオブジェクトが channel_id を持っていない場合（パースミスなど）に備えてフォールバック
        const channelLink = video.channel_id ? `channel/?c=${video.channel_id}` : '#';
        
        return `
            <a href="watch.html?v=${video.video_id}" class="video-card">
                <img src="${video.thumbnail_url}" alt="${video.title}" class="thumbnail">
                <div class="video-card-details">
                    <h3 class="video-card-title">${video.title}</h3>
                    <p class="video-card-channel">
                        <a href="${channelLink}" style="color: inherit; text-decoration: none;">${video.channel_name}</a>
                    </p>
                    <p class="video-card-views">${video.views}回視聴 • ${video.published_at}</p>
                </div>
            </a>
        `;
    }

    /**
     * Vercel APIからホーム画面の動画リストを取得し、HTMLを更新する
     * 💡 複雑なJSONレスポンス (youtubei形式) のパーシングロジックを追加
     */
    async function loadHomePageVideos() {
        const API_URL = `${BASE_API_URL}/videos/home?type=data`;
        const videoGrid = document.getElementById('video-grid');
        const loadingMessage = document.getElementById('loading-message');
        
        loadingMessage.style.display = 'block';
        videoGrid.innerHTML = ''; // グリッドをクリア

        try {
            const response = await fetch(API_URL);
            if (!response.ok) throw new Error("動画リストの取得に失敗");
            
            const data = await response.json();
            
            loadingMessage.style.display = 'none';

            // 1. 非常に深くネストされた場所にある動画の配列まで辿り着く
            // エラーを避けるため、オプショナルチェイニング (?.) を利用して安全にアクセス
            const rawItems = data?.contents
                ?.twoColumnBrowseResultsRenderer
                ?.tabs?.[0]?.tabRenderer?.content
                ?.sectionListRenderer?.contents?.[0]
                ?.itemSectionRenderer?.contents?.[0]
                ?.shelfRenderer?.content
                ?.expandedShelfContentsRenderer?.items;
            
            // rawItemsが存在しない、または配列ではない場合は処理を中断
            if (!Array.isArray(rawItems)) {
                 videoGrid.innerHTML = '<p style="grid-column: 1 / -1; color: #aaa;">動画データを解析できませんでした。</p>';
                 return;
            }

            // 2. 必要なデータのみを抽出し、元の createVideoCard 関数が期待するシンプルな形式に変換
            const videos = rawItems.map(item => {
                const video = item.videoRenderer;
                
                // videoRendererがない（広告やプレイリストなど）アイテムはスキップ
                if (!video) return null; 

                // 必要なプロパティを抽出し、シンプルなオブジェクトを生成
                return {
                    video_id: video.videoId,
                    // タイトルは runs[0].text にあると想定
                    title: video.title?.runs?.[0]?.text || 'タイトルなし',
                    // 適切なサイズのサムネイルを探し、見つからなければ最初のものを使用
                    thumbnail_url: video.thumbnail?.thumbnails?.find(t => t.width === 336)?.url || video.thumbnail?.thumbnails?.[0]?.url || '', 
                    // チャンネル名とIDは longBylineText.runs[0] にあると想定
                    channel_name: video.longBylineText?.runs?.[0]?.text || 'チャンネル名不明',
                    channel_id: video.longBylineText?.runs?.[0]?.navigationEndpoint?.browseEndpoint?.browseId || '',
                    views: video.viewCountText?.simpleText || '?',
                    published_at: video.publishedTimeText?.simpleText || '公開日不明'
                };
            }).filter(v => v !== null); // null（動画ではないアイテム）を除外
            
            // 3. 変換した videos 配列を使用してHTMLを更新
            if (videos && videos.length > 0) {
                videos.forEach(video => {
                    videoGrid.innerHTML += createVideoCard(video);
                });
            } else {
                videoGrid.innerHTML = '<p style="grid-column: 1 / -1; color: #aaa;">表示する動画がありません。</p>';
            }

        } catch (error) {
            // エラーメッセージの更新とコンソールへの出力
            console.error("ホーム動画の取得に失敗しました:", error);
            loadingMessage.textContent = '動画の読み込み中にエラーが発生しました。';
        }
    }
    
    document.addEventListener('DOMContentLoaded', loadHomePageVideos);
    // 💡 ログイン状態の確認（auth_status.jsで実装）もDOMContentLoaded後に実行されます
</script>
