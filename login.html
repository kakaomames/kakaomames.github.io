<div id="login-container">
    <h2>ログイン</h2>
    <div id="login-message" style="color: red; margin-bottom: 15px;"></div>

    <form id="login-form">
        <label for="login-username">プレイヤー名:</label><br>
        <input type="text" id="login-username" name="username" required><br><br>

        <label for="login-password">パスワード:</label><br>
        <input type="password" id="login-password" name="password" required><br><br>

        <button type="submit">ログイン</button>
    </form>

    <p>
        <a href="signin">新規アカウント登録はこちら</a>
    </p>
</div>

<script>
    // 📣 VercelのログインエンドポイントURL
    const LOGIN_URL = "https://xeroxapp040.vercel.app/login";
    const loginForm = document.getElementById('login-form');
    const loginMessageDiv = document.getElementById('login-message');

    if (loginForm) {
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault(); // ページ遷移を防ぐ (重要!)
            loginMessageDiv.textContent = ''; 
            
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;

            const formData = new URLSearchParams();
            formData.append('username', username);
            formData.append('password', password);

            try {
                // 🌟 ここが最重要: credentials: 'include'でセッションCookieを送受信する 🌟
                const response = await fetch(LOGIN_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    credentials: 'include', // これにより、Vercelから返されるSet-Cookieヘッダーがブラウザに保存される
                    body: formData
                });

                const data = await response.json();
                
                if (response.ok && data.success) {
                    // 認証成功
                    loginMessageDiv.style.color = 'green';
                    loginMessageDiv.textContent = data.message + ' メニューページへ移動します...';
                    
                    // 成功したらVercel側のメニューページへ移動（セッションが有効になっている）
                    setTimeout(() => {
                        window.location.href = data.redirect_url;
                    }, 1500); 

                } else {
                    // 認証失敗 (401 Unauthorized またはデータ内のsuccess: false)
                    loginMessageDiv.style.color = 'red';
                    loginMessageDiv.textContent = data.message || 'ログインに失敗しました。';
                }

            } catch (error) {
                console.error("ネットワークエラー:", error);
                loginMessageDiv.style.color = 'red';
                loginMessageDiv.textContent = 'ネットワークエラーによりログインできませんでした。';
            }
        });
    }
</script>
