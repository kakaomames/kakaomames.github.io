    <header id="header-bar"></header>

    <div id="watch-page-container">

            <div id="video-info">
                <h1 id="title">不明</h1>              <h3>視聴回数 : </h3><h3 id="views">不明</h3>         <h3>公開日 : </h3><h3 id="published_at"></h3><br>
                <div id="channel-and-actions">
                    <img id="channel-icon" alt="チャンネルアイコン">

                    </div>

                </div>
                <div id="description"></div>

                </div>

            </div>
    </div>

    <script src="auth_status.js"></script>
<script>
    // Vercel APIのエンドポイント
    const BASE_API_URL = "https://xeroxapp040.vercel.app/API/yt";

    /**
     * URLのクエリパラメータから動画ID (v=...) を取得する
     */
    function getVideoId() {
        const params = new URLSearchParams(window.location.search);
        return params.get('v');
    }

    /**
     * コメントHTMLを生成するヘルパー関数
     */
    function createCommentHtml(comment) {
        return `
            <div class="comment-item">
                <p class="comment-author"><strong>${comment.author}</strong></p>
                <p class="comment-text">${comment.text}</p>
            </div>
        `;
    }

    /**
     * 動画IDを元にAPIからデータを取得し、ページに反映する
     */
    async function loadVideoData(videoId) {
        if (!videoId) {
            console.error("動画IDが見つかりません。");
            document.getElementById('video-title').textContent = '動画IDがありません。';
            return;
        }

        const API_URL = `${BASE_API_URL}/video?v=${videoId}`;
        
        // 1. メタデータ（タイトル、チャンネル情報など）の取得
        try {
            const metaResponse = await fetch(API_URL);
            if (!metaResponse.ok) throw new Error("動画メタデータAPIからの応答が不正です。");
            
            const metaData = await metaResponse.json();
            
            // 💡 メタデータの更新 (JSON形式に合わせた項目をすべて反映)
            
            // 基本情報
            document.getElementById('video-page-title').textContent = metaData.title || '動画再生';
            document.getElementById('title').textContent = metaData.title || 'タイトル不明';
            document.getElementById('views-and-date').textContent = `${metaData.views || '?'} • ${metaData.published_at || '公開日不明'}`;
            document.getElementById('views').textContent = metaData.views || '視聴回数不明';
            document.getElementById('published_at').textContent = metaData.published_at || '公開日不明';
            document.getElementById('description').textContent = metaData.description || '概要欄不明';

            
            // チャンネル情報
            document.getElementById('channel-name').textContent = metaData.channel_name || 'チャンネル名不明';
            document.getElementById('channel_id').textContent = metaData.channel_id || 'チャンネル🆔不明';
            
            const channelLinkElement = document.getElementById('channel-link');
            if (channelLinkElement && metaData.channel_id) {
                 channelLinkElement.href = `/channel/?c=${metaData.channel_id}`;
            }

            // チャンネルアイコン
            const iconElement = document.getElementById('channel-icon');
            if (iconElement && metaData.profile_image_url) {
                iconElement.src = metaData.profile_image_url;
                iconElement.alt = `${metaData.channel_name}のプロフィール画像`;
            }
            
            // 説明文
            document.getElementById('video-description').textContent = metaData.description || '説明文がありません。';

            // コメント情報
            const commentCountElement = document.getElementById('comment-count');
            if (commentCountElement) {
                commentCountElement.textContent = `コメント ${metaData.comment_count || 0} 件`;
            }
            
            const commentsContainer = document.getElementById('comments-list');
            if (commentsContainer && Array.isArray(metaData.comments)) {
                commentsContainer.innerHTML = ''; // コメントリストをクリア
                metaData.comments.forEach(comment => {
                    commentsContainer.innerHTML += createCommentHtml(comment);
                });
            }

        } catch (error) {
            console.error("動画メタデータの取得に失敗しました:", error);
            document.getElementById('video-title').textContent = '動画情報の読み込み中にエラーが発生しました。';
        }

        // 2. iframe の src URL の取得
        try {
            const iframeResponse = await fetch(`${BASE_API_URL}/iframe/${videoId}`);
            if (!iframeResponse.ok) throw new Error("iframe URL APIからの応答が不正です。");
            
            const iframeData = await iframeResponse.json();
            
            if (iframeData.iframe_url) {
                const iframeElement = document.getElementById('video-iframe');
                iframeElement.src = iframeData.iframe_url;
                
                // アスペクト比の設定 (CSSで処理されていない場合)
                iframeElement.style.height = (iframeElement.clientWidth * 9 / 16) + 'px'; 
            } else {
                console.error("iframe URLがJSON応答に含まれていません。");
            }
        } catch (error) {
            console.error("iframe URLの取得に失敗しました:", error);
        }
    }
    
    // ページロード時に実行
    document.addEventListener('DOMContentLoaded', () => {
        loadVideoData(getVideoId());
        // 💡 ログイン状態の確認（auth_status.jsで実装）もDOMContentLoaded後に実行されます
    });
</script>
