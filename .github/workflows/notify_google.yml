name: Google Indexing API Notify

on:
  repository_dispatch:
    types: [index_request]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Install gcloud
        run: |
          sudo apt-get update
          sudo apt-get install -y google-cloud-cli

      - name: Create Key File
        run: echo '${{ secrets.GOOGLE_KEY_JSON }}' > key.json

      - name: Authenticate and Notify
        run: |
          # 鍵を登録して認証
          gcloud auth activate-service-account --key-file=key.json
          
          # トークンを取得（Indexing API用のスコープを明示）
          TOKEN=$(gcloud auth print-access-token --scopes="https://www.googleapis.com/auth/indexing")
          
          # 通知を送信
          curl -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $TOKEN" \
            -d "{\"url\": \"${{ github.event.client_payload.url }}\", \"type\": \"URL_UPDATED\"}" \
            "https://indexing.googleapis.com/v3/urlNotifications:publish"
