<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アイテムJSON作成 | JS単独版</title>
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="robots" content="index, follow">
    <meta name="description" content="Gemini programming隊によるマイクラアドオンアイテムJSON作成サポートサイト">
    <meta name="author" content="Gemini programming隊">
    <link rel="icon" href="https://kakaomames.github.io/rei/logo.png">
    
    <style>
        body { font-family: sans-serif; padding: 0; background-color: #f4f4f4; margin: 0; }
        header { background-color: #2c3e50; color: white; padding: 10px 20px; text-align: right; }
        header a { color: #f1c40f; text-decoration: none; font-weight: bold; margin-left: 15px; }
        header a:hover { text-decoration: underline; }
        .container { max-width: 600px; margin: 20px auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); }
        h1 { color: #333; margin-top: 0; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input[type="text"] { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { margin-top: 20px; padding: 10px 15px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        .message { margin-top: 20px; padding: 15px; border-radius: 4px; background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        pre { background-color: #eee; padding: 10px; border-radius: 4px; overflow-x: auto; margin-top: 15px; }
    </style>
</head>
<body>
    <header>
        <span>Gemini programming隊 アドオンサポート</span>
        <a href="explanation.html">数値基準の説明書はこちらへ 📖</a>
    </header>
    
    <div class="container">
        <h1>✨ アイテムJSON作成ツール (JS完結)</h1>
        <p>入力後、ボタンを押すとJSONファイルがダウンロードされます。数値の基準はヘッダーの説明書リンクを確認してください。</p>
        
        <form id="itemForm">
            <label for="item_id">アイテムID <span style="color: red;">*</span> (例: myaddon:custom_sword)</label>
            <input type="text" id="item_id" name="item_id" required>

            <label for="item_name">アイテム名 (表示名)</label>
            <input type="text" id="item_name" name="item_name" required>

            <label for="texture_path">テクスチャパス <span style="color: red;">*</span> (例: 'item_icons/custom_sword')</label>
            <input type="text" id="texture_path" name="texture_path" required>

            <label for="durability">耐久力 (数値。空白の場合、ツールではない)</label>
            <input type="text" id="durability" name="durability" placeholder="例: 500 (鉄のツルハシは約250)">

            <label for="defense">防御力 (数値。空白の場合、防具ではない)</label>
            <input type="text" id="defense" name="defense" placeholder="例: 5 (ダイヤモンドチェストプレートは約8)">

            <button type="submit">JSONファイルをダウンロード 💾</button>
        </form>

        <div id="resultMessage" class="message" style="display: none;"></div>
        <div id="jsonOutput" style="display: none;">
            <h3>生成されたJSONプレビュー</h3>
            <pre id="jsonContent"></pre>
        </div>
    </div>

    <script>
        const MESSAGE_DIV = document.getElementById('resultMessage');
        const JSON_CONTENT_PRE = document.getElementById('jsonContent');
        const JSON_OUTPUT_DIV = document.getElementById('jsonOutput');
        
        document.getElementById('itemForm').addEventListener('submit', function(e) {
            e.preventDefault(); 
            
            MESSAGE_DIV.style.display = 'none';
            JSON_OUTPUT_DIV.style.display = 'none';

            const itemId = document.getElementById('item_id').value.trim();
            const itemName = document.getElementById('item_name').value.trim();
            const texturePath = document.getElementById('texture_path').value.trim();
            const durability = document.getElementById('durability').value.trim();
            const defense = document.getElementById('defense').value.trim();

            console.log(`itemId:${itemId}`);
            
            if (!itemId || !itemName || !texturePath) {
                MESSAGE_DIV.style.display = 'block';
                MESSAGE_DIV.className = 'message error';
                MESSAGE_DIV.innerHTML = '❌ エラー: アイテムID、アイテム名、テクスチャパスは必須です。';
                return;
            }

            let itemData = {
                "format_version": "1.10.0",
                "minecraft:item": {
                    "description": {
                        "identifier": itemId,
                        "category": "equipment" 
                    },
                    "components": {
                        "minecraft:icon": texturePath,
                        "minecraft:display_name": itemName
                    }
                }
            };
            
            let components = itemData["minecraft:item"]["components"];

            let hasError = false;
            // 1. 耐久力チェック
            if (durability) {
                const durVal = parseInt(durability);
                if (isNaN(durVal) || durVal <= 0) {
                     MESSAGE_DIV.style.display = 'block';
                     MESSAGE_DIV.className = 'message error';
                     MESSAGE_DIV.innerHTML = '❌ エラー: 耐久力は正の数値で入力してください。';
                     hasError = true;
                } else {
                    components["minecraft:max_damage"] = durVal;
                    components["minecraft:hand_equipped"] = true;
                    components["minecraft:allow_off_hand"] = true;
                }
            }

            // 2. 防御力チェック
            if (defense && !hasError) {
                const defVal = parseInt(defense);
                if (isNaN(defVal) || defVal < 0) {
                     MESSAGE_DIV.style.display = 'block';
                     MESSAGE_DIV.className = 'message error';
                     MESSAGE_DIV.innerHTML = '❌ エラー: 防御力は0以上の数値で入力してください。';
                     hasError = true;
                } else {
                    components["minecraft:armor"] = { "protection": defVal };
                    itemData["minecraft:item"]["description"]["category"] = "armor";
                    if (!durability) {
                        components["minecraft:max_damage"] = components["minecraft:max_damage"] || 100;
                    }
                }
            }

            if (hasError) return;
            
            const jsonString = JSON.stringify(itemData, null, 4);
            const parts = itemId.split(':');
            const fileName = (parts.length > 1 ? parts[1] : itemId) + '.json';
            
            // --- JSONファイルのダウンロード処理 ---
            const blob = new Blob([jsonString], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.download = fileName;
            a.href = url;
            
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            // メッセージとプレビューの表示
            MESSAGE_DIV.style.display = 'block';
            MESSAGE_DIV.className = 'message'; 
            MESSAGE_DIV.innerHTML = `✅ JSONファイル **${fileName}** のダウンロードを開始しました！`;
            
            JSON_CONTENT_PRE.textContent = jsonString;
            JSON_OUTPUT_DIV.style.display = 'block';
        });
    </script>
</body>
</html>
