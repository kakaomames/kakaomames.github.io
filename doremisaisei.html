<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="https://kakaomames.github.io/rei/logo.png">
    <title>Harmonic Player - Gemini Programming</title>
    <style>
        body { font-family: 'Courier New', monospace; background: #000510; color: #00ffff; text-align: center; padding: 20px; }
        .player-unit { border: 4px solid #00ffff; background: #0a111a; padding: 40px; border-radius: 30px; display: inline-block; box-shadow: 0 0 40px #00ffff; }
        .display { font-size: 5rem; color: #fff; text-shadow: 0 0 20px #00ffff; margin: 20px 0; }
        .harmonics-list { font-size: 1rem; color: #ff00ff; height: 1.5em; }
        button { background: #00ffff; color: #000; border: none; padding: 20px 50px; font-weight: bold; cursor: pointer; font-size: 1.5rem; border-radius: 10px; margin: 10px; }
        button:disabled { background: #333; }
        .logo { width: 80px; }
    </style>
</head>
<body>
    <img src="https://kakaomames.github.io/rei/logo.png" class="logo">
    <h1>🎹 HARMONIC SYNTH UNIT 🎹</h1>
    
    <div class="player-unit">
        <input type="file" id="jsonFile" accept=".json">
        <div id="info">高精度JSONをロードせよ</div>
        
        <div class="display" id="mainNote">---</div>
        <div class="harmonics-list" id="hNotes"></div>
        
        <button id="playBtn" disabled onclick="playUltraScore()">▶️ 演奏開始</button>
        <button onclick="stopAll()">🛑 停止</button>
    </div>

    <script>
        let audioCtx = null;
        let scoreData = [];
        let isPlaying = false;
        let timers = [];

        const noteFreqs = {
            "C": 261.63, "C#": 277.18, "D": 293.66, "D#": 311.13, "E": 329.63, 
            "F": 349.23, "F#": 369.99, "G": 392.00, "G#": 415.30, "A": 440.00, 
            "A#": 466.16, "B": 493.88
        };

        document.getElementById('jsonFile').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            const text = await file.text();
            scoreData = JSON.parse(text);
            document.getElementById('playBtn').disabled = false;
            document.getElementById('info').innerText = `${scoreData.length}音の重層データを検知！`;
        });

        function getFreq(noteStr) {
            const match = noteStr.match(/([A-G]#?)(\d)/);
            if (!match) return null;
            const name = match[1];
            const octave = parseInt(match[2]);
            return noteFreqs[name] * Math.pow(2, octave - 4);
        }

        async function playUltraScore() {
            stopAll();
            isPlaying = true;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const startT = audioCtx.currentTime;

            scoreData.forEach(item => {
                // 1. メインの音を表示・予約
                const t1 = setTimeout(() => {
                    if(!isPlaying) return;
                    document.getElementById('mainNote').innerText = item.n;
                    document.getElementById('hNotes').innerText = "Harmonics: " + (item.h ? item.h.join(", ") : "none");
                }, item.t * 1000);
                timers.push(t1);

                // 2. 基本音を鳴らす
                playSound(item.n, item.t, startT, 0.2); // 音量0.2

                // 3. 倍音(h)をすべて同時に鳴らす！
                if (item.h) {
                    item.h.forEach(hNote => {
                        playSound(hNote, item.t, startT, 0.05); // 倍音は少し小さめ(0.05)で鳴らす
                    });
                }
            });
        }

        function playSound(noteStr, delay, startT, vol) {
            const freq = getFreq(noteStr);
            if (!freq) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            // ここを 'square' にするとマイクラ・ファミコン風になるぞ！
            osc.type = 'triangle'; 
            osc.frequency.setValueAtTime(freq, startT + delay);

            gain.gain.setValueAtTime(vol, startT + delay);
            gain.gain.exponentialRampToValueAtTime(0.001, startT + delay + 0.3); // 0.3秒かけて消える

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(startT + delay);
            osc.stop(startT + delay + 0.3);
        }

        function stopAll() {
            isPlaying = false;
            timers.forEach(clearTimeout);
            timers = [];
            if (audioCtx) audioCtx.close();
            document.getElementById('mainNote').innerText = "---";
            document.getElementById('hNotes').innerText = "";
        }
    </script>
</body>
</html>
