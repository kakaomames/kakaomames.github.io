<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTubeチャンネル動画リスト</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
        .container { max-width: 900px; margin: auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); }
        h1 { color: #cc0000; text-align: center; }
        #channel-info { margin-bottom: 20px; padding: 10px; background-color: #e0f7fa; border-left: 5px solid #00bcd4; }
        #videos-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .video-item { border: 1px solid #ddd; border-radius: 4px; overflow: hidden; transition: transform 0.2s; background: #fff; }
        .video-item:hover { transform: translateY(-5px); box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15); }
        .video-item img { width: 100%; height: auto; display: block; }
        .video-details { padding: 15px; }
        .video-details h3 { margin: 0 0 10px 0; font-size: 1.1em; height: 3.3em; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .video-details p { margin: 5px 0; font-size: 0.9em; color: #555; }
        .video-details a { text-decoration: none; color: #cc0000; font-weight: bold; }
        #error-message { color: red; text-align: center; margin-top: 20px; font-weight: bold; }
    </style>
    <style src="/style">
</head>
<body>

<div class="container">
    <h1>チャンネル動画リスト</h1>
    <div id="channel-info">
        チャンネルID: <span id="channel-id-display">読み込み中...</span>
    </div>

    <div id="error-message"></div>
    <div id="videos-list">
        </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const channelId = urlParams.get('c'); // URLパラメータからチャンネルIDを取得

        const channelIdDisplay = document.getElementById('channel-id-display');
        const videosList = document.getElementById('videos-list');
        const errorMessageDiv = document.getElementById('error-message');

        if (!channelId) {
            channelIdDisplay.textContent = 'チャンネルIDがありません (URLに ?c=ID を追加してください)';
            return;
        }

        channelIdDisplay.textContent = channelId;
        videosList.innerHTML = '動画リストを読み込み中...';
        errorMessageDiv.textContent = ''; // エラーメッセージをクリア

        // 🚨 修正: 確実に /API/yt/channel/videos にアクセスし、JSON構造に対応させる
        fetch(`https://xeroxapp039.vercel.app/API/yt/channel/videos?c=${encodeURIComponent(channelId)}`)
            .then(response => {
                // HTTPステータスコードが4xxや5xxの場合もJSONをパースするためにresponse.json()を返す
                return response.json().then(data => ({
                    status: response.status,
                    body: data
                }));
            })
            .then(result => {
                videosList.innerHTML = ''; // ローディングメッセージをクリア

                if (result.status !== 200 || result.body.error) {
                    // エラーメッセージを表示
                    const errorMsg = result.body.error || `動画リストの取得に失敗しました (HTTP Status: ${result.status})`;
                    errorMessageDiv.textContent = `エラー: ${errorMsg}`;
                    return;
                }

                const videos = result.body.videos;

                if (videos.length === 0) {
                    videosList.innerHTML = '<p>このチャンネルには動画がありません。</p>';
                    return;
                }

                videos.forEach(video => {
                    const videoItem = document.createElement('div');
                    videoItem.className = 'video-item';
                    
                    // サムネイルURLが存在しない場合はダミー画像を使用
                    const thumbnailUrl = video.thumbnail_url && video.thumbnail_url !== 'dummy' 
                                         ? video.thumbnail_url 
                                         : 'https://via.placeholder.com/320x180?text=No+Thumbnail';
                    
                    // 動画へのリンクURLを構築
                    const videoUrl = `watch?v=${video.video_id}`;

                    videoItem.innerHTML = `
                        <a href="${videoUrl}" target="_blank">
                            <img src="${thumbnailUrl}" alt="${video.title}">
                        </a>
                        <div class="video-details">
                            <h3><a href="${videoUrl}" target="_blank">${video.title}</a></h3>
                            <p><strong>視聴回数:</strong> ${video.views}</p>
                            <p><strong>公開日:</strong> ${video.published_at}</p>
                        </div>
                    `;
                    videosList.appendChild(videoItem);
                });
            })
            .catch(error => {
                videosList.innerHTML = '';
                errorMessageDiv.textContent = `ネットワークエラー: ${error.message}`;
                console.error('Fetch error:', error);
            });
    });
</script>

</body>
</html>
