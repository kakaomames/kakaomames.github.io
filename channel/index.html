<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTubeチャンネル動画リスト</title>
    <style>
        /* 🚨 YouTube風CSSの適用 */
        body { 
            font-family: 'Roboto', Arial, sans-serif; /* YouTubeで使われるフォントに近いものを指定 */
            margin: 0; 
            padding: 20px;
            background-color: #0f0f0f; /* ダークテーマの背景色 */
            color: #ffffff; /* 文字色を白に */
        }
        .container { 
            max-width: 1200px; /* 少し幅を広く */
            margin: auto; 
            background: #0f0f0f; /* 背景を維持 */
            padding: 0; 
        }
        h1 { 
            color: #ffffff; 
            text-align: left; /* 左寄せ */
            font-size: 2em;
            margin-bottom: 20px;
        }
        #channel-info { 
            margin-bottom: 30px; 
            padding: 10px 15px; 
            background-color: #272727; /* 濃いグレーの背景 */
            border-radius: 4px;
            color: #ccc;
        }
        #channel-id-display {
            color: #ffffff;
            font-weight: bold;
        }
        /* 動画グリッド */
        #videos-list { 
            display: grid; 
            /* PCでは4列、タブレットでは2列、スマホでは1列に自動調整 */
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); 
            gap: 20px; 
        }
        /* 動画カード */
        .video-item { 
            border-radius: 8px; /* 角を丸く */
            overflow: hidden; 
            transition: transform 0.2s, box-shadow 0.2s; 
            background: #0f0f0f; /* 背景色なし */
            cursor: pointer;
        }
        .video-item:hover { 
            transform: none; /* ホバーで動かさない */
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.3); /* ホバー時に赤いシャドウ */
        }
        .video-item a {
            text-decoration: none;
            color: inherit;
        }
        /* サムネイルと画像 */
        .video-item img { 
            width: 100%; 
            aspect-ratio: 16 / 9; /* 16:9の比率を維持 */
            object-fit: cover;
            border-radius: 4px;
            display: block; 
        }
        /* 詳細エリア */
        .video-details { 
            padding: 12px 0 0 0; /* 上だけパディング */
        }
        .video-details h3 { 
            margin: 0; 
            font-size: 0.95em; 
            font-weight: 500;
            line-height: 1.4;
            height: 2.8em; /* 2行分を確保 */
            overflow: hidden; 
            text-overflow: ellipsis; 
            display: -webkit-box; 
            -webkit-line-clamp: 2; 
            -webkit-box-orient: vertical;
            color: #ffffff;
        }
        /* メタデータ（視聴回数、公開日） */
        .video-details p { 
            margin: 4px 0; 
            font-size: 0.8em; 
            color: #aaaaaa; /* YouTubeの薄いグレー */
            line-height: 1.3;
        }
        .video-details .channel-name {
            font-weight: 500;
            color: #aaa;
        }
        /* エラーメッセージ */
        #error-message { 
            color: #ff0000; /* YouTubeの赤 */
            text-align: center; 
            margin-top: 20px; 
            font-weight: bold; 
        }
    </style>
</head>
<body>

<div class="container">
    <h1>チャンネル動画リスト</h1>
    <div id="channel-info">
        チャンネルID: <span id="channel-id-display">読み込み中...</span>
    </div>

    <div id="error-message"></div>
    <div id="videos-list">
        </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const channelId = urlParams.get('c'); // URLパラメータからチャンネルIDを取得

        const channelIdDisplay = document.getElementById('channel-id-display');
        const videosList = document.getElementById('videos-list');
        const errorMessageDiv = document.getElementById('error-message');

        if (!channelId) {
            channelIdDisplay.textContent = 'チャンネルIDがありません (URLに ?c=ID を追加してください)';
            return;
        }

        channelIdDisplay.textContent = channelId;
        videosList.innerHTML = '動画リストを読み込み中...';
        errorMessageDiv.textContent = ''; // エラーメッセージをクリア

        // 🚨 修正: 確実に /API/yt/channel/videos にアクセスし、JSON構造に対応させる
        fetch(`https://xeroxapp039.vercel.app/API/yt/channel/videos?c=${encodeURIComponent(channelId)}`)
            .then(response => {
                // HTTPステータスコードが4xxや5xxの場合もJSONをパースするためにresponse.json()を返す
                return response.json().then(data => ({
                    status: response.status,
                    body: data
                }));
            })
            .then(result => {
                videosList.innerHTML = ''; // ローディングメッセージをクリア

                if (result.status !== 200 || result.body.error) {
                    // エラーメッセージを表示
                    const errorMsg = result.body.error || `動画リストの取得に失敗しました (HTTP Status: ${result.status})`;
                    errorMessageDiv.textContent = `エラー: ${errorMsg}`;
                    return;
                }

                const videos = result.body.videos;

                if (videos.length === 0) {
                    videosList.innerHTML = '<p>このチャンネルには動画がありません。</p>';
                    return;
                }

                videos.forEach(video => {
                    const videoItem = document.createElement('div');
                    videoItem.className = 'video-item';
                    
                    // サムネイルURLが存在しない場合はダミー画像を使用
                    const thumbnailUrl = video.thumbnail_url && video.thumbnail_url !== 'dummy' 
                                         ? video.thumbnail_url 
                                         : 'https://via.placeholder.com/320x180?text=No+Thumbnail';
                    
                    // 動画へのリンクURLを構築
                    const videoUrl = `/watch?v=${video.video_id}`;

                    videoItem.innerHTML = `
                        <a href="${videoUrl}" target="">
                            <img src="${thumbnailUrl}" alt="${video.title}">
                        </a>
                        <div class="video-details">
                            <h3><a href="${videoUrl}" target="_blank">${video.title}</a></h3>
                            <p><strong>視聴回数:</strong> ${video.views}</p>
                            <p><strong>公開日:</strong> ${video.published_at}</p>
                        </div>
                    `;
                    videosList.appendChild(videoItem);
                });
            })
            .catch(error => {
                videosList.innerHTML = '';
                errorMessageDiv.textContent = `ネットワークエラー: ${error.message}`;
                console.error('Fetch error:', error);
            });
    });
</script>

</body>
</html>
