<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>YouTube Sig Lab - Gemini programming隊</title>
</head>
<body>
    <h1>YouTube Sig Lab 🧪</h1>
    <p>ステータス: <span id="status">解析中...</span></p>
    <div id="links"></div>

    <script>
        // 1. アップロードされたJSONの内容をここに定義（隊員が手動で貼り付ける想定）
        // 実際には _.js を読み込むことで自動定義されるが、ここでは直接操作する。
        var ytInitialPlayerResponse = {
            /* ここに _.json の中身を流し込む */
        };

        // 2. expireの自動生成（現在時刻 + 6時間）
        const newExpire = Math.floor(Date.now() / 1000) + 21600;
        console.log("new_expire:" + newExpire);

        // 3. データの下準備
        function patchData() {
            if (!ytInitialPlayerResponse.streamingData) return;
            const formats = (ytInitialPlayerResponse.streamingData.formats || [])
                .concat(ytInitialPlayerResponse.streamingData.adaptiveFormats || []);
            
            formats.forEach(fmt => {
                if (fmt.signatureCipher) {
                    // expireを最新に書き換え
                    fmt.signatureCipher = fmt.signatureCipher.replace(/expire%3D\d+/, "expire%3D" + newExpire);
                }
            });
            console.log("JSON_patched:OK");
        }

        patchData();
    </script>

    <script src="https://kakaomame.github.io/base.js"></script>

    <script>
        window.addEventListener('load', function() {
            console.log("base.js loaded. Checking decipher result...");
            
            // base.jsが正常に動けば、ytInitialPlayerResponseの中の
            // signatureCipherが自動的にデコードされ、urlパラメータにsigが統合される。
            
            setTimeout(() => {
                const formats = (ytInitialPlayerResponse.streamingData.formats || [])
                    .concat(ytInitialPlayerResponse.streamingData.adaptiveFormats || []);
                
                const linksDiv = document.getElementById('links');
                formats.forEach((fmt, i) => {
                    if (fmt.url) {
                        const a = document.createElement('a');
                        a.href = fmt.url;
                        a.innerText = `[Format ${i}] 署名済みURLを開く (${fmt.mimeType})`;
                        a.target = "_blank";
                        linksDiv.appendChild(a);
                        linksDiv.appendChild(document.createElement('br'));
                    }
                });
                document.getElementById('status').innerText = "解析完了！URLを生成したぞ！";
            }, 1000); // 処理待ち
        });

        // ページ推移（指示通り！）
        document.addEventListener('click', function() {
            console.log("Next stage...");
            // window.location.href = '次のページ.html';
        });
    </script>
</body>
</html>
