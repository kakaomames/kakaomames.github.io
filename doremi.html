<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>AudioWorklet Precision Analyzer</title>
    <style>
        body { font-family: 'Courier New', monospace; background: #000; color: #0f0; text-align: center; }
        .monitor { border: 2px solid #0f0; padding: 20px; margin: 20px auto; width: 300px; font-size: 3rem; }
        #log { width: 90%; height: 200px; background: #111; color: #0f0; overflow-y: scroll; border: 1px solid #333; margin: auto; text-align: left; padding: 10px; font-size: 0.8rem; }
        button { padding: 10px 20px; font-weight: bold; cursor: pointer; background: #0f0; border: none; }
    </style>
</head>
<body>
    <h1>🚀 AudioWorklet Engine 🚀</h1>
    <input type="file" id="audioFile" accept="audio/*">
    <div class="monitor" id="noteDisplay">READY</div>
    <div id="freqDisplay">0.00 Hz</div>
    <div id="log"></div>

    <script>
        // 1. AudioWorkletProcessorの中身（超高速レーンで動くコード）
        const processorCode = `
            class PitchProcessor extends AudioWorkletProcessor {
                constructor() {
                    super();
                    this.lastSampleTime = 0;
                }
                process(inputs, outputs) {
                    const input = inputs[0];
                    if (input.length > 0) {
                        const samples = input[0];
                        // 128サンプルごとにメインスレッドへ報告（約2.9ms間隔）
                        this.port.postMessage({
                            samples: samples,
                            t: currentTime
                        });
                    }
                    return true;
                }
            }
            registerProcessor('pitch-processor', PitchProcessor);
        `;

        let audioCtx, analyzer, source, workletNode;
        const noteStrings = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

        async function initAudio(fileUrl) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            // Blobを使ってProcessorを読み込む
            const blob = new Blob([processorCode], { type: 'application/javascript' });
            const url = URL.createObjectURL(blob);
            await audioCtx.audioWorklet.addModule(url);

            const audio = new Audio(fileUrl);
            source = audioCtx.createMediaElementSource(audio);
            workletNode = new AudioWorkletNode(audioCtx, 'pitch-processor');

            // 超高速レーンからのメッセージを受信
            workletNode.port.onmessage = (event) => {
                detectPitch(event.data.samples, event.data.t);
            };

            source.connect(workletNode);
            workletNode.connect(audioCtx.destination);
            audio.play();
        }

        // ピッチ検出アルゴリズム（ゼロ交差法：簡易版）
        let lastNote = "";
        function detectPitch(samples, time) {
            let crossings = 0;
            for (let i = 1; i < samples.length; i++) {
                if (samples[i-1] < 0 && samples[i] >= 0) crossings++;
            }
            
            const frequency = crossings * (audioCtx.sampleRate / samples.length) / 2;
            if (frequency > 20 && frequency < 4000) {
                const note = getNote(frequency);
                if (note && note !== lastNote) {
                    updateDisplay(note, frequency, time);
                    lastNote = note;
                }
            }
        }

        function getNote(f) {
            const n = Math.round(12 * (Math.log(f / 440) / Math.log(2))) + 69;
            return noteStrings[n % 12] + (Math.floor(n / 12) - 1);
        }

        function updateDisplay(note, freq, t) {
            document.getElementById('noteDisplay').innerText = note;
            document.getElementById('freqDisplay').innerText = freq.toFixed(2) + " Hz";
            const log = document.getElementById('log');
            log.innerHTML = \`[\${t.toFixed(3)}s] Note: \${note} (\${freq.toFixed(2)}Hz)<br>\` + log.innerHTML;
        }

        document.getElementById('audioFile').addEventListener('change', (e) => {
            const url = URL.createObjectURL(e.target.files[0]);
            initAudio(url);
        });
    </script>
</body>
</html>
