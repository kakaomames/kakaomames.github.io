<!DOCTYPE html>
<html lang="ja">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Programming隊 - JSON統合基地</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; text-align: center; padding: 20px; background: #2c3e50; color: white; }
        #drop-area { border: 4px dashed #3498db; padding: 40px; border-radius: 20px; background: #34495e; transition: 0.3s; margin: 20px auto; max-width: 600px; }
        #drop-area.highlight { border-color: #2ecc71; background: #456268; }
        .btn { padding: 15px 25px; font-size: 18px; cursor: pointer; border: none; border-radius: 10px; margin: 10px; font-weight: bold; transition: 0.2s; }
        .btn-select { background: #3498db; color: white; }
        .btn-download { background: #2ecc71; color: white; }
        .btn-reset { background: #e74c3c; color: white; }
        .btn:active { transform: scale(0.95); }
        #status { font-size: 1.2em; margin: 20px; color: #ecf0f1; }
    </style>
</head>
<body>
    <h1>📦 JSON統合パッケージ機 📦</h1>
    <p>Gemini Programming隊・iPad専用ドック</p>

    <div id="drop-area">
        <input type="file" id="fileElem" multiple accept=".json" style="display:none">
        <button class="btn btn-select" onclick="document.getElementById('fileElem').click()">JSONファイルを選択</button>
        <p id="status">ここにファイルをドロップするか、ボタンで選択してください</p>
    </div>

    <div id="action-area">
        <button id="downloadBtn" class="btn btn-download" style="display:none" onclick="downloadJSON()">パッケージを保存 💾</button>
        <button id="resetBtn" class="btn btn-reset" style="display:none" onclick="resetData()">データを削除してやり直し 🗑️</button>
    </div>

    <script>
        let mergedData = [];
        const status = document.getElementById('status');
        const downloadBtn = document.getElementById('downloadBtn');
        const resetBtn = document.getElementById('resetBtn');

        // ファイルが選択された時の処理
        document.getElementById('fileElem').addEventListener('change', async (e) => {
            const files = e.target.files;
            if (files.length === 0) return;

            console.log(`files_received_count: ${files.length}`);
            
            for (let file of files) {
                const text = await file.text();
                try {
                    const json = JSON.parse(text);
                    // 隊員ルール：ファイル名をデータの中に埋め込んでおく！
                    json._original_filename = file.name;
                    mergedData.push(json);
                } catch (err) {
                    console.error(`json_parse_error: ${file.name}`);
                }
            }

            updateUI();
        });

        // UIの状態を更新
        function updateUI() {
            if (mergedData.length > 0) {
                status.innerText = `現在 ${mergedData.length} 個のデータを保持中...`;
                downloadBtn.style.display = 'inline-block';
                resetBtn.style.display = 'inline-block';
                console.log(`total_buffered_data: ${mergedData.length}`);
            } else {
                status.innerText = "データはありません。新しいファイルを選択してください。";
                downloadBtn.style.display = 'none';
                resetBtn.style.display = 'none';
            }
        }

        // データを削除（リセット）
        function resetData() {
            mergedData = [];
            document.getElementById('fileElem').value = ""; // 選択をクリア
            console.log("status: data_manually_reset");
            updateUI();
        }

        // 統合してダウンロード
        function downloadJSON() {
            const blob = new Blob([JSON.stringify(mergedData, null, 2)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Merged_Data_${new Date().getTime()}.json`;
            a.click();
            console.log("status: download_triggered");
            
            // ダウンロード後に自動リセットするか選べるけど、
            // 今回はあえてリセットボタンを押すまで残す仕様にしました！
        }
    </script>
</body>
</html>
