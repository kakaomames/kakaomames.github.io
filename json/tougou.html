<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:image" content="https://kakaomames.github.io/rei/logo.png">
    <title>Gemini Programming隊 - JSON統合基地</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #f0f0f0; }
        #drop-area { border: 3px dashed #aaa; padding: 40px; border-radius: 20px; background: white; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 10px; }
    </style>
</head>
<body>
    <h1>🏷️ JSON統合ツール 🏷️</h1>
    <div id="drop-area">
        <input type="file" id="fileElem" multiple accept=".json" style="display:none">
        <button onclick="document.getElementById('fileElem').click()">JSONファイルを一括選択</button>
        <p id="status">ここにファイルをドロップするか、上のボタンで選択してください</p>
    </div>
    <br>
    <button id="downloadBtn" style="display:none" onclick="downloadJSON()">統合してダウンロード 📦</button>

    <script>
        let mergedData = [];
        const fileElem = document.getElementById('fileElem');
        const status = document.getElementById('status');
        const downloadBtn = document.getElementById('downloadBtn');

        fileElem.addEventListener('change', async (e) => {
            const files = e.target.files;
            mergedData = [];
            status.innerText = `${files.length}個のファイルを読み込み中...`;
            
            for (let file of files) {
                const text = await file.text();
                try {
                    const json = JSON.parse(text);
                    mergedData.push(json);
                    // 隊員ルール：読み込むたびにログを出す！
                    console.log(`loading_file: ${file.name}`);
                } catch (err) {
                    console.error(`error_in_file: ${file.name}`);
                }
            }
            
            status.innerText = `完了！ ${mergedData.length}個のデータが合体準備OK！`;
            downloadBtn.style.display = 'inline-block';
            console.log(`total_merged_count: ${mergedData.length}`);
        });

        function downloadJSON() {
            const blob = new Blob([JSON.stringify(mergedData, null, 2)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Merged_Gemini_Data.json';
            a.click();
            console.log("status: download_started");
        }
    </script>
</body>
</html>
