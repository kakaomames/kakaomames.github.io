<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gemini Programming隊 汎用探索機">
    <meta property="og:image" content="https://kakaomames.github.io/rei/logo.png">
    <title>URL探索機 - Gemini Programming隊</title>
    <style>
        :root { --main-color: #00ff41; --bg-color: #0a0a0a; }
        body { background-color: var(--bg-color); color: var(--main-color); font-family: 'Courier New', monospace; margin: 20px; }
        .panel { background: rgba(0, 0, 0, 0.8); border: 1px solid var(--main-color); padding: 15px; width: 400px; }
        /* テキストエリアを見やすく改造！ */
        textarea { 
            width: 100%; height: 60px; background: #111; color: #fff; 
            border: 1px solid var(--main-color); margin-top: 10px; 
            font-family: monospace; padding: 5px; box-sizing: border-box;
        }
        button { background: var(--main-color); color: black; border: none; padding: 10px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        .log-box { height: 150px; overflow-y: auto; font-size: 12px; border-top: 1px dashed var(--main-color); margin-top: 10px; padding-top: 5px; }
    </style>
</head>
<body>

<div class="panel">
    <img src="https://kakaomames.github.io/rei/logo.png" style="width:50px;">
    <br><strong>復習ミッション3：URL探索</strong><br>
    
    <textarea id="urlInput">https://pokeapi.co/api/v2/pokemon/25</textarea>
    
    <button onclick="urlFetch()">1. データを取ってこい！(fetch)</button>
    <div id="log" class="log-box">ログ待機中...</div>
</div>

<script>
    function addLog(msg) {
        const log = document.getElementById('log');
        log.innerHTML += `<div>> ${msg}</div>`;
        log.scrollTop = log.scrollHeight;
        console.log(`[LOG] ${msg}`); // 隊長の教え通りログ出力！
    }

    function urlFetch() {
        // 1. テキストエリアからURLを抜き出す
        const targetUrl = document.getElementById('urlInput').value;
        addLog(`探索開始: ${targetUrl}`);

        fetch(targetUrl) // 抜き出した変数を使う！
            .then(res => {
                if(!res.ok) throw new Error(`通信失敗(Status:${res.status})`);
                return res.json();
            })
            .then(data => {
                // JSONの中身をきれいに表示
                const resultName = data.name || "名前データなし";
                addLog(`取得成功！ [名前]: ${resultName}`);
                console.log(data); // 全データはコンソールへ
            })
            .catch(err => {
                addLog(`❌ 遭難報告: ${err.message}`);
            });
    }
</script>
</body>
</html>
