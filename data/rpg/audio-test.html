<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Gemini Audio Test 🚀</title>
    <style>
        body { background: #0d1117; color: #58a6ff; font-family: monospace; text-align: center; padding-top: 50px; }
        .test-box { border: 2px solid #ff79c6; padding: 20px; display: inline-block; border-radius: 10px; }
        button { background: #238636; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 5px; cursor: pointer; }
        button:active { background: #2ea043; }
    </style>
</head>
<body>

    <div class="test-box">
        <h2>🔊 12倍速・解凍テスト</h2>
        <p>11.m4a を読み込み、1/12倍速で再生するぞ！</p>
        <button id="playBtn">⚡ 音の封印を解除</button>
    </div>

    <script>
        // --- 1. Audioオブジェクトの準備 ---
        // --- 修正版：パス指定を正確に！ ---
const targetFile = './audio/pigstep_master.m4a'; // または ''./audio/11.m4a
console.log(`targetFile:${targetFile}`);

const bgm = new Audio(targetFile);
bgm.loop = true;

// 12倍速解凍の設定
const DECODE_RATE = 0.08; 
bgm.playbackRate = DECODE_RATE;
bgm.preservesPitch = false; 

const playBtn = document.getElementById('playBtn');

playBtn.addEventListener('click', () => {
    console.log(`📡 [LOG] ${targetFile} の解凍を試みるぞ！`);
    
    // パスが正しいか、再生前に改めてチェック！
    bgm.playbackRate = DECODE_RATE;

    bgm.play().then(() => {
        let audioStatus = "success";
        console.log(`audioStatus:${audioStatus}`);
        console.log("✅ 成功！基地に本来の音が鳴り響いたぞ！");
    }).catch(err => {
        let audioStatus = "failed";
        console.log(`audioStatus:${audioStatus}`);
        console.error("❌ まだダメか！詳細：", err.message);
    });
});

// ファイル読み込みエラーの監視
bgm.onerror = () => {
    console.error(`🚨 [ERROR] ${targetFile} が見つからないか、読み込めないぞ！パスを再確認だ！`);
};
    </script>
</body>
</html>
