<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Gemini Audio Test 🚀</title>
    <style>
        body { background: #0d1117; color: #58a6ff; font-family: monospace; text-align: center; padding-top: 50px; }
        .test-box { border: 2px solid #ff79c6; padding: 20px; display: inline-block; border-radius: 10px; }
        button { background: #238636; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 5px; cursor: pointer; }
        button:active { background: #2ea043; }
    </style>
</head>
<body>

    <div class="test-box">
        <h2>🔊 12倍速・解凍テスト</h2>
        <p>11.m4a を読み込み、1/12倍速で再生するぞ！</p>
        <input type="file" id="targetFile"><br>
        <button id="playBtn">⚡ 音の封印を解除</button>
    </div>

<script>
    // 隊員が気に入った「高音質」な方法をベースにするぞ！
    const targetFiles = './audio/pigstep_master.m4a';
    const bgm = new Audio();
    const DECODE_RATE = 0.083; // 黄金のカカオマメ定数
    
    // HTMLの要素を捕まえる
    const fileInput = 
        if(!targetFile){
            alert("No file!")
            fileInput = targetFiles
            return;
        }
        elese {
            document.getElementById('targetFile');
            return;
        }
        
    const playBtn = document.getElementById('playBtn');

    playBtn.addEventListener('click', () => {
        // 1. ファイルが選ばれているかチェック
        const file = fileInput.files[0];
        if (!file) {
            alert("隊員！まずはファイルを選んでくれ！🫡");
            return;
        }

        console.log(`📡 [LOG] 選択されたファイル: ${file.name}`);

        // 2. 選んだファイルを「再生可能なURL」に変換！（ここが魔法の1行）
        const fileURL = URL.createObjectURL(file);
        console.log(`fileURL: ${fileURL}`);

        // 3. Audioオブジェクトにセット
        bgm.src = fileURL;
        bgm.loop = true;
        bgm.preservesPitch = false;
        bgm.playbackRate = DECODE_RATE;

        // 4. 再生！
        bgm.play().then(() => {
            console.log("✅ 成功！選んだ音源の封印を解除したぞ！");
        }).catch(err => {
            console.error("❌ 再生失敗：", err.message);
        });
    });

    // メモリ節約のために、使い終わったURLは本当は消したほうがいいけど、
    // テスト中はこれだけで十分だ！
</script>
</body>
</html>
