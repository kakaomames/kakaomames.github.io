<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Gemini Audio Test 🚀</title>
    <style>
        body { background: #0d1117; color: #58a6ff; font-family: monospace; text-align: center; padding-top: 50px; }
        .test-box { border: 2px solid #ff79c6; padding: 20px; display: inline-block; border-radius: 10px; }
        button { background: #238636; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 5px; cursor: pointer; }
        button:active { background: #2ea043; }
    </style>
</head>
<body>

    <div class="test-box">
        <h2>🔊 12倍速・解凍テスト</h2>
        <p>11.m4a を読み込み、1/12倍速で再生するぞ！</p>
        <input type="file" id="targetFile"><br>
        <button id="playBtn">⚡ 音の封印を解除</button>
    </div>

<script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let decodedBuffer = null;

    // ⚡ 封印解除ボタン
    document.getElementById('playBtn').addEventListener('click', async () => {
        // コンテキストの再開（ブラウザ制限解除）
        if (audioCtx.state === 'suspended') {
            await audioCtx.resume();
        }

        // ファイルを取得して一気にデコード
        const targetUrl = './audio/pigstep_master.m4a'; 
        console.log(`targetUrl:${targetUrl}`);

        try {
            const response = await fetch(targetUrl);
            const arrayBuffer = await response.arrayBuffer();
            
            // ここが「高速デコード」の核！
            // ファイルをメモリ上に展開する
            decodedBuffer = await audioCtx.decodeAudioData(arrayBuffer);
            console.log("✅ 展開完了！バッファサイズ:", decodedBuffer.length);

            // 再生用のノードを作成
            const source = audioCtx.createBufferSource();
            source.buffer = decodedBuffer;

            // ⚡ ここで12倍速を「0.08〜0.095」で巻き戻す！
            // この方式は playbackRate の精度が非常に高い！
            const DECODE_RATE = 0.09;
            source.playbackRate.value = DECODE_RATE;
            console.log(`DECODE_RATE:${DECODE_RATE}`);

            source.connect(audioCtx.destination);
            source.loop = true;
            source.start(0);

            console.log("🔊 本来の音が最速で鳴り響いたぞ！");
        } catch (err) {
            console.error("🚨 高速デコード失敗！：", err);
        }
    });
</script>
</body>
</html>
