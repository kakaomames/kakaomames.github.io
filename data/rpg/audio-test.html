<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Gemini Audio Test 🚀</title>
    <style>
        body { background: #0d1117; color: #58a6ff; font-family: monospace; text-align: center; padding-top: 50px; }
        .test-box { border: 2px solid #ff79c6; padding: 20px; display: inline-block; border-radius: 10px; }
        button { background: #238636; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 5px; cursor: pointer; }
        button:active { background: #2ea043; }
    </style>
</head>
<body>

    <div class="test-box">
        <h2>🔊 12倍速・解凍テスト</h2>
        <p>11.m4a を読み込み、1/12倍速で再生するぞ！</p>
        <input type="file" id="targetFile"><br>
        <button id="playBtn">⚡ 音の封印を解除</button>
    </div>

<script>
    const defaultFile = './audio/pigstep_master.m4a';
    const bgm = new Audio();
    const DECODE_RATE = 0.083; // 黄金のカカオマメ定数

    // 1. まず要素をしっかり捕まえる！
    const fileInput = document.getElementById('targetFile');
    const playBtn = document.getElementById('playBtn');

    playBtn.addEventListener('click', () => {
        let finalSrc = ""; // 最終的な音源パスを入れる箱

        // 2. ファイルが選ばれているかチェック
        if (fileInput.files && fileInput.files[0]) {
            // ファイルが選ばれていたらそのファイルを使う
            const file = fileInput.files[0];
            finalSrc = URL.createObjectURL(file);
            console.log(`📡 [LOG] ユーザー選択ファイルを使用: ${file.name}`);
        } else {
            // 選ばれていなければデフォルトの曲を使う
            finalSrc = defaultFile;
            console.log(`📡 [LOG] デフォルト音源を使用: ${defaultFile}`);
        }

        console.log(`finalSrc: ${finalSrc}`);

        // 3. Audioオブジェクトに設定を流し込む
        bgm.src = finalSrc;
        bgm.loop = true;
        bgm.preservesPitch = false;
        bgm.playbackRate = DECODE_RATE;

        // 4. いざ、封印解除！
        bgm.play().then(() => {
            console.log("✅ 成功！基地に音が鳴り響いたぞ！");
        }).catch(err => {
            console.error("❌ 再生失敗：", err.message);
            // デフォルトファイルも見つからない場合はここでアラートだ！
            alert("ファイルが見つからないか、読み込めないぞ！");
        });
    });
</script>
</body>
</html>
