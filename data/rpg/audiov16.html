<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gemini Programming Team - Global High Speed Audio Compressor">
    <meta name="theme-color" content="#0d1117">
    <meta property="og:image" content="https://kakaomames.github.io/rei/logo.png">
    <title>Gemini Sonic Survivor v15.8 🚀</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --container-bg: #161b22;
            --main-color: #58a6ff;
            --accent-color: #ff79c6;
            --log-color: #50fa7b;
        }
        /* 一般向け「標準モード」 */
        body.standard-mode {
            --bg-color: #f0f2f5;
            --container-bg: #ffffff;
            --main-color: #1f6feb;
            --accent-color: #d73a49;
            --log-color: #24292e;
        }

        body { font-family: 'Courier New', monospace; background: var(--bg-color); color: var(--main-color); text-align: center; padding: 20px; transition: 0.3s; }
        .container { border: 2px solid var(--main-color); padding: 30px; border-radius: 15px; background: var(--container-bg); max-width: 750px; margin: 0 auto; box-shadow: 0 0 25px var(--main-color); position: relative;}
        
        /* 設定バー */
        .settings-bar { display: flex; justify-content: space-between; margin-bottom: 20px; border-bottom: 1px solid var(--main-color); padding-bottom: 10px; }
        select, .btn-theme { background: transparent; color: var(--main-color); border: 1px solid var(--main-color); border-radius: 5px; padding: 5px; cursor: pointer; font-size: 12px; }

        .logo { width: 80px; margin: 10px 0; cursor: pointer; }
        .drop-zone { border: 3px dashed var(--accent-color); padding: 30px; margin: 20px 0; border-radius: 10px; cursor: pointer; background: rgba(0,0,0,0.2); }
        
        /* ファイルリストと変換ボタン */
        .file-list { text-align: left; margin: 20px 0; max-height: 300px; overflow-y: auto; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; }
        .file-item { display: flex; align-items: center; justify-content: space-between; background: var(--container-bg); padding: 10px; margin-bottom: 5px; border-radius: 5px; border-left: 4px solid var(--main-color); border: 1px solid rgba(255,255,255,0.1); }
        .btn-conv { background: #238636; color: white; border: none; padding: 5px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-conv:disabled { background: #484f58; cursor: not-allowed; }

        /* フッターコントロール */
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        #zipBtn { background: #1f6feb; grid-column: span 2; display: none; padding: 15px; font-size: 18px; }
        #clearBtn { background: #da3633; grid-column: span 2; display: none; }
        
        #logArea { background: #000; color: var(--log-color); text-align: left; padding: 10px; border-radius: 5px; margin-top: 15px; height: 100px; overflow-y: auto; font-size: 11px; border: 1px solid #30363d; }
    </style>
</head>
<body class="gemini-mode">

<div class="container">
    <div class="settings-bar">
        <select id="langSelector"></select>
        <button id="themeToggle" class="btn-theme">🎨 Style Change</button>
    </div>

    <img src="https://kakaomames.github.io/rei/logo.png" alt="Logo" class="logo" onclick="location.reload()">
    <h1 id="title-text">text.ui.title</h1>
    <p id="desc-text">text.ui.desc</p>

    <div class="drop-zone" id="dropZone">text.ui.dropzone</div>
    <div id="fileList" class="file-list"></div>

    <div class="controls">
        <button id="zipBtn">text.btn.zip</button>
        <button id="clearBtn">text.btn.clear</button>
    </div>

    <div id="logArea"></div>
</div>

<script src="js/main.js"></script>
</body>
</html>
