<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Gemini Sonic v6-Final-Tactics 🚀</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #0d1117;
            color: #58a6ff;
            text-align: center;
            padding: 20px;
        }
        .container {
            border: 2px solid #58a6ff;
            padding: 30px;
            border-radius: 15px;
            background: #161b22; 
            max-width: 600px;
            margin: 0 auto;
            box-shadow: 0 0 25px #58a6ff;
        }
        .logo { 
            width: 80px;
            margin-bottom: 10px;
            cursor: pointer; 
        }
        .drop-zone {
            border: 3px dashed #ff79c6;
            padding: 40px;
            margin: 20px 0;
            border-radius: 10px; 
            cursor: pointer;
            background: #010409; 
        }
        .drop-zone.dragover { background: #1f6feb; color: white; }
        button { background: #238636; color: white; border: none; padding: 15px; font-weight: bold; cursor: pointer; border-radius: 6px; width: 100%; }
        #logArea { background: #000; color: #33ff33; text-align: left; padding: 15px; border-radius: 6px; margin-top: 20px; height: 200px; overflow-y: auto; font-size: 11px; border: 1px solid #30363d; white-space: pre-wrap; }
        .progress-bar { height: 12px; background: #21262d; border-radius: 6px; margin-top: 10px; overflow: hidden; display: none; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #ff79c6, #bd93f9); width: 0%; transition: width 0.3s; }
    </style>
</head>
<body>

    <div class="container">
        <img src="https://kakaomames.github.io/rei/logo.png" alt="Logo" class="logo" onclick="location.reload()">
        <h1>Gemini Sonic v6-Final 🚀</h1>
        <p>「0kbの呪い」を解く、完全直列・待機型パッカー</p>
        
        <div class="drop-zone" id="dropZone">ここに全ての資材を投入せよ！</div>
        
        <button id="startBtn">⚡ 超圧縮作戦・開始</button>

        <div class="progress-bar" id="progressContainer">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div id="result" style="display:none; margin-top: 20px;">
            <a id="dlLink"><button style="background: #1f6feb;">📥 ZIPを保存</button></a>
        </div>

        <div id="logArea"></div>
    </div>

    <script>
        let taskList = [];
        const logArea = document.getElementById('logArea');
        const startBtn = document.getElementById('startBtn');
        const progressFill = document.getElementById('progressFill');

        function addLog(msg) {
            logArea.innerText += `[${new Date().toLocaleTimeString()}] ${msg}\n`;
            logArea.scrollTop = logArea.scrollHeight;
        }

        // フォルダ・複数ファイルを確実にリスト化
        async function getFilesRecursively(item, path = "") {
            const entry = item.webkitGetAsEntry ? item.webkitGetAsEntry() : item;
            if (entry.isFile) {
                const file = await new Promise(res => entry.file(res));
                return [{ file, path }];
            } else if (entry.isDirectory) {
                let results = [];
                const reader = entry.createReader();
                const entries = await new Promise(res => reader.readEntries(res));
                for (const child of entries) {
                    const subResults = await getFilesRecursively(child, path + entry.name + "/");
                    results = results.concat(subResults);
                }
                return results;
            }
            return [];
        }

        const dropZone = document.getElementById('dropZone');
        dropZone.ondragover = e => { e.preventDefault(); dropZone.classList.add('dragover'); };
        dropZone.ondragleave = () => dropZone.classList.remove('dragover');
        dropZone.ondrop = async e => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            addLog("📂 資材の鑑定を開始...");
            
            taskList = [];
            const items = e.dataTransfer.items;
            for(let i=0; i<items.length; i++) {
                const files = await getFilesRecursively(items[i]);
                taskList = taskList.concat(files);
            }
            addLog(`捕捉完了: ${taskList.length}個のアイテムを認識！`);
        };

        // v6をさらに慎重にした録音エンジン
        async function recordV6Final(file) {
            return new Promise(async (resolve, reject) => {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                try {
                    const arrayBuffer = await file.arrayBuffer();
                    const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                    
                    const source = audioCtx.createBufferSource();
                    source.buffer = audioBuffer;
                    source.playbackRate.value = 12.0;
                    
                    const streamDest = audioCtx.createMediaStreamDestination();
                    source.connect(streamDest);
                    
                    const recorder = new MediaRecorder(streamDest.stream);
                    const chunks = [];
                    
                    recorder.ondataavailable = e => { if(e.data.size > 0) chunks.push(e.data); };
                    recorder.onstop = () => {
                        const blob = new Blob(chunks, { type: 'audio/mp4' });
                        audioCtx.close(); // ここで完全に閉じる
                        resolve(blob);
                    };

                    recorder.start();
                    source.start(0);

                    setTimeout(() => {
                        source.stop();
                        recorder.stop();
                    }, (audioBuffer.duration / 12) * 1000 + 400); // 余裕を400msに拡大
                } catch (e) {
                    audioCtx.close();
                    reject(e);
                }
            });
        }

        startBtn.onclick = async () => {
            if (taskList.length === 0) return alert('資材を投入してくれ！');
            startBtn.disabled = true;
            document.getElementById('progressContainer').style.display = 'block';
            const zip = new JSZip();

            for (let i = 0; i < taskList.length; i++) {
                const { file, path } = taskList[i];
                const isTarget = file.size > 0 && (file.type.includes('audio') || file.type.includes('video') || file.name.match(/\.(mp3|wav|ogg|m4a|aac|mp4|mov)$/i));

                if (isTarget) {
                    addLog(`⚡ 歪曲中: ${path}${file.name}`);
                    try {
                        const blob = await recordV6Final(file);
                        if(blob.size < 100) throw new Error("0kb虚無を検知！");
                        
                        const newName = file.name.replace(/\.[^/.]+$/, "") + ".m4a";
                        zip.file(path + newName, blob);
                        addLog(`   ✅ 成功: ${blob.size} bytes`);
                    } catch (e) {
                        addLog(`   ⚠️ エラー回避のためそのまま格納: ${file.name}`);
                        zip.file(path + file.name, file);
                    }
                } else {
                    addLog(`   📦 構造維持コピー: ${file.name}`);
                    zip.file(path + file.name, file);
                }

                // 【ここが最重要】1個ごとにクールダウンを入れてブラウザを休ませる
                await new Promise(res => setTimeout(res, 800));

                const percent = ((i + 1) / taskList.length) * 100;
                progressFill.style.width = percent + "%";
            }

            addLog("🏁 終了！ZIPを生成中...");
            const zipBlob = await zip.generateAsync({ type: "blob" });
            document.getElementById('dlLink').href = URL.createObjectURL(zipBlob);
            document.getElementById('dlLink').download = `Gemini_Final_Victory.zip`;
            document.getElementById('result').style.display = 'block';
            addLog("コンプリート！ZIPを受け取れ！🫡🚩");
            startBtn.disabled = false;
        };
    </script>
</body>
</html>
