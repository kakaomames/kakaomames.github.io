<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Gemini Sonic Structure-Packer v7</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body { font-family: 'Courier New', monospace; background: #0d1117; color: #58a6ff; text-align: center; padding: 20px; }
        .container { border: 2px solid #58a6ff; padding: 30px; border-radius: 15px; background: #161b22; max-width: 700px; margin: 0 auto; box-shadow: 0 0 25px #58a6ff; }
        .drop-zone { border: 3px dashed #58a6ff; padding: 50px; margin: 20px 0; border-radius: 10px; cursor: pointer; background: #010409; transition: 0.3s; }
        .drop-zone.dragover { background: #1f6feb; transform: scale(1.02); }
        #logArea { background: #000; color: #33ff33; text-align: left; padding: 15px; border-radius: 6px; margin-top: 20px; height: 250px; overflow-y: auto; font-size: 11px; border: 1px solid #30363d; white-space: pre-wrap; }
        button { background: #238636; color: white; border: none; padding: 15px; font-weight: bold; cursor: pointer; border-radius: 6px; width: 100%; font-size: 18px; }
        .progress { height: 10px; background: #21262d; border-radius: 5px; margin: 10px 0; display: none; overflow: hidden; }
        .progress-fill { height: 100%; background: #58a6ff; width: 0%; transition: 0.2s; }
    </style>
</head>
<body>

<div class="container">
    <h1>Gemini Sonic v7 🚀</h1>
    <p>フォルダ階層・完全維持プロトコル発動中</p>
    
    <div class="drop-zone" id="dropZone">ここに「フォルダ」をまるごとドロップしてくれ！</div>
    
    <div class="progress" id="progressContainer"><div class="progress-fill" id="progressFill"></div></div>

    <div id="result" style="display:none; margin-top: 20px;">
        <a id="dlLink"><button style="background: #1f6feb;">📥 構造を維持したままZIPを保存</button></a>
    </div>

    <div id="logArea"></div>
</div>

<script>
    const logArea = document.getElementById('logArea');
    const dropZone = document.getElementById('dropZone');
    const progressFill = document.getElementById('progressFill');

    function addLog(msg) {
        logArea.innerText += `[${new Date().toLocaleTimeString()}] ${msg}\n`;
        logArea.scrollTop = logArea.scrollHeight;
    }

    // 12倍速録音の核
    async function compressAudio(file) {
        const audioCtx = new AudioContext();
        const arrayBuffer = await file.arrayBuffer();
        const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
        const source = audioCtx.createBufferSource();
        source.buffer = audioBuffer;
        source.playbackRate.value = 12.0;
        const streamDest = audioCtx.createMediaStreamDestination();
        source.connect(streamDest);
        const recorder = new MediaRecorder(streamDest.stream);
        const chunks = [];
        return new Promise(resolve => {
            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.onstop = () => resolve(new Blob(chunks, { type: 'audio/mp4' }));
            recorder.start();
            source.start();
            setTimeout(() => { source.stop(); recorder.stop(); audioCtx.close(); }, (audioBuffer.duration / 12) * 1000 + 300);
        });
    }

    // フォルダを再帰的に探検する関数
    async function traverseAndPack(entry, zip, path = "") {
        if (entry.isFile) {
            const file = await new Promise(res => entry.file(res));
            if (file.type.includes('audio') || file.name.match(/\.(mp3|wav|ogg|m4a)$/i)) {
                addLog(`⚡ 歪み発生: ${path}${file.name}`);
                const blob = await compressAudio(file);
                const newName = file.name.replace(/\.[^/.]+$/, "") + ".m4a";
                zip.file(path + newName, blob);
                addLog(`✅ 完了: ${newName}`);
            }
        } else if (entry.isDirectory) {
            addLog(`📂 フォルダ進入: ${entry.name}`);
            const reader = entry.createReader();
            const entries = await new Promise(res => reader.readEntries(res));
            for (const child of entries) {
                await traverseAndPack(child, zip, path + entry.name + "/");
            }
        }
    }

    dropZone.ondragover = e => { e.preventDefault(); dropZone.classList.add('dragover'); };
    dropZone.ondragleave = () => dropZone.classList.remove('dragover');
    dropZone.ondrop = async e => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        
        const items = e.dataTransfer.items;
        if (!items) return;

        document.getElementById('progressContainer').style.display = 'block';
        const zip = new JSZip();
        addLog("🚀 ミッション開始：階層構造の解析中...");

        for (let i = 0; i < items.length; i++) {
            const item = items[i].webkitGetAsEntry();
            if (item) await traverseAndPack(item, zip);
            progressFill.style.width = ((i + 1) / items.length * 100) + "%";
        }

        addLog("✨ 全ての時空を歪め終えた！パッキング中...");
        const zipBlob = await zip.generateAsync({ type: "blob" });
        document.getElementById('dlLink').href = URL.createObjectURL(zipBlob);
        document.getElementById('dlLink').download = `audio_Compression_Pack.zip`;
        document.getElementById('result').style.display = 'block';
        addLog("🏁 ミッション完了！ZIPを回収してくれ！");
    };
</script>
</body>
</html>
